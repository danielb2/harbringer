[package]
name = "mplex"
version = "0.1.0"
edition = "2021"
description = "A minimal single-file Plex and Jellyfin media server"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
get_if_addrs = "0.5"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
rcgen = { version = "0.13", features = ["aws_lc_rs"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "multipart", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vuio-media-info = "0.1.4"
