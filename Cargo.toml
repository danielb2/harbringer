[package]
name = "harbringer"
version = "0.1.1"
edition = "2021"
description = "A Rust Plex Media Server replacement"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
get_if_addrs = "0.5"
isolang = { version = "2.4", features = ["lowercase_names"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
rcgen = { version = "0.13", features = ["aws_lc_rs"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1.2"
serde_urlencoded = "0.7"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "multipart", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vuio-media-info = "0.1.4"
bytes = "1"
broadcast-common = "11.0.0"
matroska-demuxer = "0.8.1"
transmux = { version = "=0.30.0", default-features = false, features = ["std"] }
tempfile = "3"
oxideav-ac3 = "=0.0.12"
oxideav-aac = "=0.1.7"
oxideav-core = "0.1"
rusty_aac = { version = "=2.0.1", default-features = false }
rust_h265 = "=0.4.1"
rusty_h264-common = "=0.16.1"
rusty_h264-encoder = "=0.16.1"

[profile.dev]
opt-level = 3
incremental = false


[profile.dev.package.oxideav-aac]
opt-level = 3

[profile.dev.package.oxideav-core]
opt-level = 3

[profile.dev.package.oxideav-ac3]
opt-level = 3

[profile.dev.package.rusty_aac]
opt-level = 3

[profile.dev.package.matroska-demuxer]
opt-level = 3

[profile.dev.package.transmux]
opt-level = 3

[profile.dev.package.rust_h265]
opt-level = 3

[profile.dev.package.rusty_h264-encoder]
opt-level = 3
